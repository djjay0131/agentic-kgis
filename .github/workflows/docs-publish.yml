name: Docs — build, validate, and publish

# Builds the KGIS documentation site (docs-site/, MkDocs Material), validates
# the satellite publishing manifest against the hub contract, and runs the
# base-path link-check. The publish to the research hub is now ENABLED on a push
# to main (and on manual dispatch): the `kgis` satellite is provisioned — the WIF
# provider, publish SA and prefix-scoped IAM are applied in website/infra, and the
# GCP_* repo variables are set. Pull requests still build, validate and
# link-check but do NOT publish: the hub's WIF binding admits refs/heads/main only,
# so a PR cannot authenticate, and publishing from an unreviewed PR is the wrong
# direction anyway.

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "pyproject.toml"
      - ".github/workflows/docs-publish.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "pyproject.toml"
      - ".github/workflows/docs-publish.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write          # required by the publish action (WIF); harmless otherwise

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build the docs site
        run: uv run --extra docs mkdocs build --strict -f docs-site/mkdocs.yml

      # MkDocs cleans site_dir on build, so the manifest is copied AFTER the
      # build. It must land at the ROOT of the uploaded dist folder.
      - name: Stage the manifest into dist/
        run: cp docs-site/manifest.json docs-site/dist/manifest.json

      - name: Set up Node (for the contract validator)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Validate the manifest against the hub contract
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/djjay0131/website/v1/contract/validate-manifest.mjs \
            -o /tmp/validate-manifest.mjs
          curl -fsSL \
            https://raw.githubusercontent.com/djjay0131/website/v1/contract/manifest.schema.json \
            -o /tmp/manifest.schema.json
          node /tmp/validate-manifest.mjs --dist docs-site/dist --source kgis

      - name: Base-path link-check
        run: |
          python3 docs-site/linkcheck.py \
            --dist docs-site/dist \
            --base-path /projects/kgis/kgis-docs/

      # ---------------------------------------------------------------------
      # PUBLISH — enabled 2026-10-01. The `kgis` satellite is provisioned:
      #   1. Terraform in website/infra applied the `kgis` source, the github-kgis
      #      WIF provider, the ref-pinned impersonation binding and the
      #      prefix-conditioned bucket binding (website commit a68feea).
      #   2. Repo variables GCP_PROJECT_ID, GCP_WIF_PROVIDER, GCP_PUBLISH_SA and
      #      GCP_CONTENT_BUCKET are set.
      # It runs on a push to main and on manual dispatch, NOT on a pull request:
      # the hub's WIF binding admits refs/heads/main only, so a PR cannot
      # authenticate, and an unreviewed PR must not publish.
      # ---------------------------------------------------------------------
      - name: Publish to the research hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: djjay0131/website/contract/publish@v1
        with:
          dist: docs-site/dist
          source: kgis
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUBLISH_SA }}
          bucket: ${{ vars.GCP_CONTENT_BUCKET }}
