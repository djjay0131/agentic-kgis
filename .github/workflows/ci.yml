name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -v

  # Issue #37: the `test` job installs `.[dev]`, so pytest is importable in it by
  # construction and it is structurally blind to a dev-only dependency leaking
  # into a runtime `__init__` chain. This job installs the published dependency
  # set only (`pip install .`, no extras) — what an adopter gets — and imports the
  # packages plus the subpackage entry points adopters use directly.
  #
  # Defence in depth, not the primary guard: `tests/test_packaging.py` runs the
  # same invariant as an exhaustive sweep inside the `test` job, which IS a
  # required status check. This job is currently advisory (see the delta,
  # §Platform Enforcement Reality), so the enforcement lives in the sweep.
  #
  # Matrix covers the floor `requires-python = ">=3.11"` advertises; the `test`
  # job only ever exercised 3.12.
  runtime-import:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - run: pip install .
      - name: pytest must not be installed
        run: |
          python - <<'PY'
          import importlib.util
          import sys

          if importlib.util.find_spec("pytest") is not None:
              sys.exit("pytest is installed; this job cannot prove the runtime import surface")
          PY
      # src layout: these resolve to the installed distribution, not to `src/`.
      - name: runtime and adopter entry points import
        run: |
          python - <<'PY'
          import importlib

          for name in (
              "kg_contracts",
              "kg_eval",
              "kgis",
              "kgis.evidence",
              "kgis.extraction",
              "kgis.ledger",
              "kgis.registry",
              "kgis.sources",
              "kgis.structured",
              "kgis.testing",
          ):
              importlib.import_module(name)
          print("all runtime entry points import without the [dev] extra")
          PY

  # The governance check command declared in
  # llm/governance/governance-delta.md §Governance Check Command, run on every
  # push and PR rather than only at onboarding. agentic-governance is pinned by
  # commit SHA so the canon cannot change under this repo without a visible
  # commit here. The two checkouts are siblings, not nested: the checker walks
  # every .md under its target repo's git toplevel, so the canon tree must sit
  # outside it.
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The diff-based checks compare against the base ref.
          fetch-depth: 0
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: djjay0131/agentic-governance
          # agentic-governance v0.9.0.
          ref: 851a50a0692d4409cbd255e3b3be111d863ae264
          path: governance-canon
      - run: node ../governance-canon/plugin/scripts/governance-checks.mjs --layout
        working-directory: repo
